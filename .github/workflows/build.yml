name: Build plugin

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install
      - run: npm run build
      - name: Commit generated main.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.js
          if git diff --cached --quiet; then
            echo "main.js is already up to date"
          else
            git commit -m "build: update main.js"
            git push
          fi
