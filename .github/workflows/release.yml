name: Release plugin

on:
  push:
    branches: [main]
    paths:
      - 'manifest.json'
      - 'src/**'
      - 'styles.css'
      - 'package.json'
      - 'tsconfig.json'
      - 'esbuild.config.mjs'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Read version
        id: version
        run: echo "version=$(node -p \"require('./manifest.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Validate release files
        run: |
          test -f manifest.json
          test -f main.js
          test -f styles.css

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
          else
            gh release create "$TAG" manifest.json main.js styles.css \
              --target main \
              --title "$TAG" \
              --generate-notes \
              --prerelease
          fi
